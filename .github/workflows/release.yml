name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify tag matches VERSION
        run: test "${GITHUB_REF_NAME}" = "v$(tr -d '[:space:]' < VERSION)"
      - run: scripts/build-release.sh
      - name: Attest release archive provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes_file="RELEASE_NOTES_${version}.md"
          release_args=(
            "$GITHUB_REF_NAME"
            dist/*
            --verify-tag
            --title "My T Companion ${version}"
          )
          if [[ -f "$notes_file" ]]; then
            release_args+=(--notes-file "$notes_file")
            for localized_notes in "RELEASE_NOTES_${version}".*.md; do
              [[ -f "$localized_notes" ]] || continue
              release_args+=("$localized_notes")
            done
          else
            release_args+=(--generate-notes)
          fi
          gh release create "${release_args[@]}"
